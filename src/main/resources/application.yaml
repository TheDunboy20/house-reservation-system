spring:
  application:
    name: house-reservation-system
  datasource:
    url: jdbc:sqlite:./db/house_reservation_system.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax